# Voice/dashboard presets for the Polytron washer.
# Google exposes scripts as scenes -> "Hey Google, activate Wash 20 Minutes"

wash_5:
  alias: "Wash 5 Minutes"
  icon: mdi:washing-machine
  sequence:
    - action: number.set_value
      target: {entity_id: number.polytron_washing_machine_wash_minutes}
      data: {value: 5}
    - action: button.press
      target: {entity_id: button.polytron_washing_machine_start_wash}

