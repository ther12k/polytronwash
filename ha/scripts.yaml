# Voice/dashboard presets for the Polytron washer — Bahasa Indonesia.
# Google Assistant exposes scripts as scenes:
#   "Ok Google, aktifkan Cuci 20 Menit" / "aktifkan Bilas" / "aktifkan Keringkan"
# Add Bahasa Indonesia in Google Assistant settings (Google Home app →
# Settings → Google Assistant → Languages) for best recognition, and expose
# these scripts in the Google Assistant integration once.

cuci:
  alias: "Cuci"
  aliases: ["Wash"]
  icon: mdi:washing-machine
  sequence:
    - action: button.press
      target: {entity_id: button.polytron_washing_machine_start_wash}

cuci_5:
  alias: "Cuci 5 Menit"
  aliases: ["Wash 5 Minutes"]
  icon: mdi:washing-machine
  sequence:
    - action: number.set_value
      target: {entity_id: number.polytron_washing_machine_wash_minutes}
      data: {value: 5}
    - action: button.press
      target: {entity_id: button.polytron_washing_machine_start_wash}

